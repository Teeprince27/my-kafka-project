server.port=8099
server.servlet.context-path=/product-service
spring.application.name=product-service
logging.path=/Users/temitopeajayi/Downloads/kafka-project/logs

topic.name=product-created-events-topic
partition.count=3
replica.count=3
min.insync.replicas=min.insync.replicas
min.insync.replicas.value=2


spring.kafka.producer.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
#spring.kafka.producer.retries=10
#spring.kafka.producer.properties.retry.backoff.ms=1000

spring.kafka.producer.properties.delivery.timeout.ms=120000
spring.kafka.producer.properties.linger.ms=0
spring.kafka.producer.properties.request.timeout.ms=30000

spring.datasource.url=jdbc:mysql://localhost:3306/kafkaProductService?createDatabaseIfNotExist=true
spring.datasource.username =springstudent
spring.datasource.password =springstudent
spring.datasource.driver-class-name = com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=create-drop